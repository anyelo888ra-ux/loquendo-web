<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="cyan-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="20" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg-grad)" />
  <circle cx="200" cy="150" r="300" fill="#06b6d4" opacity="0.08" filter="url(#glow)" />
  <circle cx="1000" cy="480" r="350" fill="#3b82f6" opacity="0.08" filter="url(#glow)" />

  <g transform="translate(150, 165)">
    <rect x="0" y="0" width="100" height="100" rx="24" fill="url(#cyan-grad)" />
    <path d="M35 30 L35 70 L65 50 Z" fill="#020617" />
    
    <text x="130" y="55" font-family="system-ui, sans-serif" font-weight="900" font-size="52" fill="#ffffff" letter-spacing="2">LOQUENDO WEB</text>
    <text x="130" y="90" font-family="system-ui, sans-serif" font-weight="700" font-size="20" fill="#06b6d4" letter-spacing="4">ECOSYSTEM & DISCORD OAUTH2</text>
  </g>

  <g transform="translate(150, 340)">
    <text x="0" y="0" font-family="system-ui, sans-serif" font-weight="800" font-size="38" fill="#f8fafc">Sintetizador de Voz TTS Online</text>
    <text x="0" y="45" font-family="system-ui, sans-serif" font-weight="400" font-size="22" fill="#94a3b8">Genera voces en español, modula el tono y velocidad sin bases de datos externas.</text>
  </g>

  <g transform="translate(150, 470)">
    <rect x="0" y="0" width="220" height="48" rx="12" fill="#5865F2" />
    <text x="35" y="30" font-family="system-ui, sans-serif" font-weight="700" font-size="16" fill="#ffffff">loquendo oauth</text>
    
    <rect x="240" y="0" width="220" height="48" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2" />
    <text x="275" y="30" font-family="system-ui, sans-serif" font-weight="700" font-size="16" fill="#f59e0b">loquendo premium</text>
  </g>

  <g transform="translate(780, 240)" filter="url(#glow)">
    <rect x="0" y="80" width="40" height="120" rx="20" fill="url(#cyan-grad)" />
    <rect x="60" y="20" width="40" height="240" rx="20" fill="url(#cyan-grad)" />
    <rect x="120" y="0" width="40" height="280" rx="20" fill="url(#cyan-grad)" />
    <rect x="180" y="50" width="40" height="180" rx="20" fill="url(#cyan-grad)" />
    <rect x="240" y="100" width="40" height="90" rx="20" fill="url(#cyan-grad)" />
  </g>
</svg>