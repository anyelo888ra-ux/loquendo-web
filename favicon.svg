<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="#020617" />
  <rect x="32" y="32" width="448" height="448" rx="100" fill="url(#grad)" opacity="0.15" />
  <rect x="40" y="40" width="432" height="432" rx="92" fill="none" stroke="url(#grad)" stroke-width="12" opacity="0.8" />
  <g filter="url(#glow)">
    <rect x="120" y="216" width="32" height="80" rx="16" fill="url(#grad)" />
    <rect x="176" y="160" width="32" height="192" rx="16" fill="url(#grad)" />
    <rect x="232" y="96" width="32" height="320" rx="16" fill="url(#grad)" />
    <rect x="288" y="144" width="32" height="224" rx="16" fill="url(#grad)" />
    <rect x="344" y="200" width="32" height="112" rx="16" fill="url(#grad)" />
  </g>
</svg>